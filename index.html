<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小林的博客</title>
  <meta name="description" content="小林的博客 —— 把折腾过的事,写成看得懂的文字。">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <!-- 顶部:居中文字 Logo + 导航 -->
  <header class="site-header" id="top">
    <a class="logo-text" href="index.html">小林的博客</a>
    <nav class="site-nav">
      <a class="active" href="index.html">首页</a>
      <a href="about.html">关于我</a>
      <a href="#contact">联系</a>
      <a class="icon-link" href="https://github.com/Michaellin0302" target="_blank" rel="noopener" aria-label="GitHub">
        <svg viewBox="0 0 16 16" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
    </nav>
  </header>

  <!-- 主视觉:大标题打字机 + 口号 -->
  <section class="hero">
    <div class="hero-inner fade-up">
      <h1 class="hero-title"><span id="typeline"></span><span class="cursor"></span></h1>
      <p class="hero-slogan">把折腾过的事,写成看得懂的文字。</p>
    </div>
    <a class="scroll-hint" href="#contact" aria-label="向下滚动">▼</a>
  </section>

  <!-- 联系方式 -->
  <section class="contact fade-up d2" id="contact">
    <p class="kicker">$ contact --email</p>
    <h2>联系我</h2>
    <p class="contact-sub">想交流技术、聊聊建站,或者单纯打个招呼,都可以。</p>
    <a class="mail-card" href="mailto:972053745@qq.com">
      <span class="mail-ico">✉️</span>
      <span>972053745@qq.com</span>
    </a>
    <p class="contact-note">点击即可直接发邮件</p>
  </section>

  <!-- 页脚 -->
  <footer>
    <div class="container">
      <div class="foot-center">
        <a class="logo-text sm" href="#top">小林的博客</a>
        <p class="foot-slogan">记录 · 折腾 · 分享</p>
        <nav class="foot-links">
          <a href="index.html">首页</a>
          <a href="about.html">关于我</a>
          <a href="mailto:972053745@qq.com">邮箱</a>
          <a href="https://github.com/Michaellin0302" target="_blank" rel="noopener">GitHub</a>
        </nav>
        <div class="foot-bottom center">
          <span>© 2026 小林的博客 · Powered by <b>GitHub Pages</b></span>
          <a href="#top">回到顶部 ↑</a>
        </div>
      </div>
    </div>
  </footer>

  <script>
    (function () {
      var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* 打字机大标题 */
      var el = document.getElementById("typeline");
      var text = "你好,我是小林。";
      if (el) {
        if (reduced) { el.textContent = text; }
        else {
          var i = 0;
          (function tick() {
            el.textContent = text.slice(0, i);
            if (i < text.length) { i++; setTimeout(tick, 160); }
          })();
        }
      }
    })();
  </script>
</body>
</html>
